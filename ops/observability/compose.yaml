# 관측 스택 — nextroute API/Worker 배포(/root/apps/nextroute)와 분리된 별도 compose 프로젝트.
# VPS 배포: /root/apps/observability/ 로 복사 후 `docker compose up -d`.
# 이미지 태그는 도입 시점 안정 버전으로 고정 — 업그레이드는 의도적으로만.
services:
  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
    logging: &logrotate
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  alloy:
    image: grafana/alloy:v1.9.0
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    restart: always
    logging: *logrotate

  prometheus:
    image: prom/prometheus:v3.4.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    networks:
      - default
      - nextroute
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
    logging: *logrotate

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: always
    logging: *logrotate

  grafana:
    image: grafana/grafana:12.0.0
    ports:
      - "127.0.0.1:3000:3000"   # loopback 전용 — nginx 리버스프록시 경유만
    env_file:
      - env/grafana.env
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
    logging: *logrotate

  tempo:
    image: grafana/tempo:2.7.0
    command: -config.file=/etc/tempo/tempo.yaml
    # 30분마다 블록 완성 때 순간 ~640MB(2026-10-27 실측, 블록은 2MB). 상한이 없으면 호스트 메모리를 같이 깎는다.
    # GOMEMLIMIT: Go GC 가 상한 전에 회수. oom_score_adj: 호스트가 바닥나면 OTP 대신 이게 먼저 죽게.
    environment:
      GOMEMLIMIT: 512MiB
    mem_limit: 768m
    memswap_limit: 768m
    oom_score_adj: 500
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - default
      - nextroute   # API/Worker가 nextroute_default 경유로 OTLP 전송
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
    logging: *logrotate

  # 장애 알림 AI 분석기(docs/plan/alert-analyzer). Grafana webhook 연동이 여기로 보낸다.
  # 포트 공개 없음 — Grafana 만 내부망으로 부른다. Loki/Prometheus 를 읽어야 해서 default 네트워크.
  # 메모리 상한 + oom_score_adj: 호스트가 바닥나면 OTP 보다 이 컨테이너가 먼저 죽게 한다.
  alert-analyzer:
    image: ${ALERT_ANALYZER_IMAGE:-ghcr.io/minsuk330/nextroute-alert-analyzer:latest}
    env_file:
      - env/alert-analyzer.env
    # idle RSS: PR-1 40~45MiB(운영 실측), PR-2 anthropic SDK 포함 약 88MiB·분석 중 +10MiB(로컬 실측).
    mem_limit: 192m
    memswap_limit: 192m
    oom_score_adj: 500
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    logging: *logrotate

networks:
  # nextroute 서비스가 속한 네트워크에 연결 → Prometheus가 api/worker:8081 스크랩.
  # 실제 네트워크 이름은 `docker network ls | grep nextroute`로 확인 후 맞출 것.
  nextroute:
    external: true
    name: nextroute_default

volumes:
  loki-data:
  prom-data:
  grafana-data:
  alloy-data:
  tempo-data:
