# 관측 스택 — nextroute API/Worker 배포(/root/apps/nextroute)와 분리된 별도 compose 프로젝트.
# VPS 배포: /root/apps/observability/ 로 복사 후 `docker compose up -d`.
# 이미지 태그는 도입 시점 안정 버전으로 고정 — 업그레이드는 의도적으로만.
services:
  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
    logging: &logrotate
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  alloy:
    image: grafana/alloy:v1.9.0
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    restart: always
    logging: *logrotate

  prometheus:
    image: prom/prometheus:v3.4.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    networks:
      - default
      - nextroute
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
    logging: *logrotate

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: always
    logging: *logrotate

  grafana:
    image: grafana/grafana:12.0.0
    ports:
      - "127.0.0.1:3000:3000"   # loopback 전용 — nginx 리버스프록시 경유만
    env_file:
      - env/grafana.env
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
    logging: *logrotate

  tempo:
    image: grafana/tempo:2.7.0
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - default
      - nextroute   # API/Worker가 nextroute_default 경유로 OTLP 전송
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
    logging: *logrotate

networks:
  # nextroute 서비스가 속한 네트워크에 연결 → Prometheus가 api/worker:8081 스크랩.
  # 실제 네트워크 이름은 `docker network ls | grep nextroute`로 확인 후 맞출 것.
  nextroute:
    external: true
    name: nextroute_default

volumes:
  loki-data:
  prom-data:
  grafana-data:
  alloy-data:
  tempo-data:
