# VPS: /etc/nginx/sites-available/grafana.refit-100.site → sites-enabled 심링크.
# 443 server block + HTTP→HTTPS redirect는 `certbot --nginx -d grafana.refit-100.site` 실행 시 추가됨.
# certbot 실행 후 실제 생성된 설정에서 redirect/443 proxy 적용 여부 반드시 확인.
server {
    server_name grafana.refit-100.site;
    listen 80;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana Live (websocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
