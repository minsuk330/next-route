global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # API/Worker management 포트(8081, 미공개). Prometheus만 nextroute_default 네트워크 소속.
  - job_name: nextroute-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]
        labels:
          role: api
      - targets: ["worker:8081"]
        labels:
          role: worker
      - targets: ["worker2:8081"]
        labels:
          role: worker2

  # OTP JVM metrics exposed by the in-process JMX exporter agent.
  - job_name: otp
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["otp:9404"]
        labels:
          role: otp
