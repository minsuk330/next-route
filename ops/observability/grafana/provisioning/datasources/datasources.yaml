apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # 로그의 traceId JSON 필드 → Tempo 트레이스로 점프(derived field).
      # $$는 compose 환경변수 치환 회피(Grafana가 ${__value.raw}로 해석).
      derivedFields:
        - name: TraceID
          matcherType: regex
          matcherRegex: '"traceId":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # 트레이스 → 해당 traceId의 Loki 로그로 역점프.
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true

  # 사용 통계 대시보드(dashboards/usage.json). 읽기 전용 계정 grafana_ro — 권한은 ops/observability/postgres/grafana_ro.sql
  - name: nextroute-postgres
    uid: nextroute-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_ro
    jsonData:
      database: mydatabase
      sslmode: disable
      maxOpenConns: 2
      maxIdleConns: 1
      connMaxLifetime: 14400
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_PG_PASSWORD
