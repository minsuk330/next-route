apiVersion: 1

# Slack Incoming Webhook 으로 바로 보낸다(AI 분석 없음 — 분석기가 죽어도 알림은 가야 한다).
# URL 은 env/grafana.env 의 SLACK_ALERT_WEBHOOK_URL (gitignore). Grafana 가 provisioning 로드 시 치환.
contactPoints:
  - orgId: 1
    name: slack-alerts
    receivers:
      - uid: slack-alerts
        type: slack
        settings:
          url: $SLACK_ALERT_WEBHOOK_URL
          # 기본 본문 뒤에 fingerprint 줄을 붙인다. 분석기(alert-analyzer)가 채널 최근 메시지에서
          # 이 값을 찾아 같은 스레드에 답글을 단다. provisioning 이 $VAR 를 env 로 치환하므로 $ 금지.
          text: |-
            {{ template "default.message" . }}
            fp: {{ range .Alerts }}{{ .Fingerprint }} {{ end }}
        disableResolveMessage: false
      # AI 분석기(alert-analyzer). 연동마다 따로 발송·재시도되므로 이쪽이 실패해도 Slack 알림은 간다.
      # 토큰은 env/grafana.env 와 env/alert-analyzer.env 의 ANALYZER_WEBHOOK_TOKEN (같은 값).
      - uid: alert-analyzer
        type: webhook
        settings:
          url: http://alert-analyzer:8000/webhook/grafana
          authorization_scheme: Bearer
          authorization_credentials: $ANALYZER_WEBHOOK_TOKEN
        disableResolveMessage: true
