# Test-only override. Keep the production compose and its OTP_IMAGE untouched.
# Run with:
#   OTP_TEST_IMAGE=... OTP_TEST_GRAPH_PATH=... \
#   docker compose -f compose.yaml -f compose.otp-test.yaml up -d --force-recreate --no-deps otp
services:
  otp:
    image: ${OTP_TEST_IMAGE:?OTP_TEST_IMAGE is required}
    volumes:
      - "${OTP_TEST_GRAPH_PATH:?OTP_TEST_GRAPH_PATH is required}/graph.obj:/var/opentripplanner/graph.obj:ro"
      - "${OTP_TEST_ARTIFACT_PATH:?OTP_TEST_ARTIFACT_PATH is required}:/var/opentripplanner/experiment-artifacts"
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: >-
        -Xms256m -Xmx2500m -XX:+UseG1GC
        -Xlog:gc*,safepoint:file=/var/opentripplanner/experiment-artifacts/gc-%t.log:time,uptime,level,tags:filecount=5,filesize=50M
        -javaagent:/opt/otp/jmx_prometheus_javaagent-1.6.0.jar=9404:/opt/otp/otp-jmx.yaml
    expose:
      - "9404"
