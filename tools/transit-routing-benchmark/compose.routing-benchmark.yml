services:
  otp-build:
    image: opentripplanner/opentripplanner:2.9.0
    working_dir: /var/opentripplanner
    volumes:
      - ./data/otp:/var/opentripplanner
      - ./data/input/south-korea-seoul-metro.osm.pbf:/var/opentripplanner/south-korea-seoul-metro.osm.pbf:ro
      - ./data/input/seoul-ktdb-normalized.gtfs.zip:/var/opentripplanner/seoul-ktdb-normalized.gtfs.zip:ro
      - ./config/otp/build-config.json:/var/opentripplanner/build-config.json:ro
    command: ["--build", "--save"]
    profiles: ["build"]

  otp:
    image: opentripplanner/opentripplanner:2.9.0
    working_dir: /var/opentripplanner
    volumes:
      - ./data/otp:/var/opentripplanner
      - ./data/input/south-korea-seoul-metro.osm.pbf:/var/opentripplanner/south-korea-seoul-metro.osm.pbf:ro
      - ./data/input/seoul-ktdb-normalized.gtfs.zip:/var/opentripplanner/seoul-ktdb-normalized.gtfs.zip:ro
      - ./config/otp/build-config.json:/var/opentripplanner/build-config.json:ro
      - ./config/otp/otp-config.json:/var/opentripplanner/otp-config.json:ro
    command: ["--load", "--serve"]
    ports:
      - "18080:8080"
    healthcheck:
      # The OTP image intentionally has no curl/wget. A loaded graph means the
      # server has completed its startup path; the smoke query checks HTTP too.
      test: ["CMD-SHELL", "test -s /var/opentripplanner/graph.obj"]
      interval: 10s
      timeout: 5s
      retries: 30

  graphhopper:
    image: eclipse-temurin:17-jre
    working_dir: /app
    volumes:
      - ./data:/data
      - ./config/graphhopper:/config:ro
    command: ["java", "-Xmx5g", "-Xms2g", "-jar", "/data/graphhopper/graphhopper-web-11.0.jar", "server", "/config/config-pt.yml"]
    ports:
      - "18989:8989"
      - "18990:8990"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8990/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30

  graphhopper-import:
    image: eclipse-temurin:17-jre
    working_dir: /app
    volumes:
      - ./data:/data
      - ./config/graphhopper:/config:ro
    command: ["java", "-Xmx5g", "-Xms2g", "-jar", "/data/graphhopper/graphhopper-web-11.0.jar", "import", "/config/config-pt.yml"]
    profiles: ["build"]
