# 수도권 OTP (national-otp-map-migration P1). bbox GTFS(202503, calendar ±2mo) + seoul-metro PBF.
services:
  otp-build:
    image: opentripplanner/opentripplanner:2.9.0
    working_dir: /var/opentripplanner
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx11g -XX:+UseStringDeduplication"
    volumes:
      - ./data/otp-seoul:/var/opentripplanner
      - ./data/input/south-korea-seoul-metro.osm.pbf:/var/opentripplanner/south-korea-seoul-metro.osm.pbf:ro
      - ./data/input/seoul-bbox-202503.gtfs.zip:/var/opentripplanner/seoul-bbox-202503.gtfs.zip:ro
      - ./config/otp-seoul/build-config.json:/var/opentripplanner/build-config.json:ro
    command: ["--build", "--save"]
    profiles: ["build"]

  otp:
    image: opentripplanner/opentripplanner:2.9.0
    working_dir: /var/opentripplanner
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx3500m -XX:+UseStringDeduplication"
    volumes:
      - ./data/otp-seoul:/var/opentripplanner
      - ./data/input/south-korea-seoul-metro.osm.pbf:/var/opentripplanner/south-korea-seoul-metro.osm.pbf:ro
      - ./data/input/seoul-bbox-202503.gtfs.zip:/var/opentripplanner/seoul-bbox-202503.gtfs.zip:ro
      - ./config/otp-seoul/build-config.json:/var/opentripplanner/build-config.json:ro
      - ./config/otp-seoul/otp-config.json:/var/opentripplanner/otp-config.json:ro
    command: ["--load", "--serve"]
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/opentripplanner/graph.obj"]
      interval: 10s
      timeout: 5s
      retries: 60
