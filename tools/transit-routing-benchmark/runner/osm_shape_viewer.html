<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>502 · OSM × Naver</title>
<style>body{margin:0;font:15px system-ui;color:#152239}#map{height:100vh}aside{position:absolute;z-index:10;top:20px;left:20px;width:310px;background:white;padding:22px;border-radius:16px;box-shadow:0 6px 30px #0002}h1{font-size:23px;margin:5px 0 12px}p{line-height:1.6;color:#546174}button,select{padding:9px;border:1px solid #ccd3dc;border-radius:7px;background:white;margin:3px;cursor:pointer}button:hover{background:#eef4ff}small{display:block;margin-top:12px;line-height:1.5}#status{font-size:13px;color:#526580}</style>
<div id="map"></div><aside><small>OSM 원본 형상 · Naver Web SDK</small><h1>502번 노선 비교</h1><select id="route"><option value="7172324">한국은행행 · 파랑</option><option value="4712439">반대 방향 · 주황</option><option value="all">양방향 함께</option></select><p>도로 선 좌표 그대로 표시합니다.<br>누락 구간은 직선으로 연결하지 않습니다.</p><button id="fit">전체 보기</button><button id="sadang">사당 확대</button><button id="seoul">서울역 확대</button><p><label><input id="visible" type="checkbox" checked> 노선 표시</label> <label><input id="stops" type="checkbox"> 정류장</label></p><div id="status">지도 로딩 중…</div><small>2026-09-04 POC 저장본 · 최신 OSM과 다를 수 있음<br><a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap contributors</a><br>Native SDK 성능 검증은 별도입니다.</small></aside>
<script>
const statusEl=document.getElementById('status');
window.navermap_authFailure=()=>statusEl.textContent='Naver 인증 실패: Web Dynamic Map 활성화와 localhost 허용 URL을 확인해야 합니다.';
async function init(){
const cfg=await fetch('/config').then(r=>r.json());
await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId='+encodeURIComponent(cfg.key);s.onload=resolve;s.onerror=reject;document.head.append(s)});
const n=window.naver.maps;const map=new n.Map('map',{center:new n.LatLng(37.48,126.98),zoom:12,zoomControl:true});
const data=await fetch('/route.geojson').then(r=>r.json());let lines=[],markers=[],bounds;
const selected=()=>document.getElementById('route').value;
function draw(){lines.forEach(x=>x.setMap(null));markers.forEach(x=>x.setMap(null));lines=[];markers=[];bounds=new n.LatLngBounds();let count=0;
for(const f of data.features){if(selected()!=='all'&&String(f.properties.relation_id)!==selected())continue;
if(f.geometry.type==='MultiLineString'){for(const part of f.geometry.coordinates){const pts=part.map(([lng,lat])=>new n.LatLng(lat,lng));pts.forEach(p=>bounds.extend(p));count+=pts.length;lines.push(new n.Polyline({map:document.getElementById('visible').checked?map:null,path:pts,strokeColor:f.properties.relation_id===7172324?'#165cf5':'#e96912',strokeWeight:5,strokeOpacity:.85}));}}
else if(f.geometry.type==='Point'&&document.getElementById('stops').checked){const [lng,lat]=f.geometry.coordinates;markers.push(new n.Circle({map,center:new n.LatLng(lat,lng),radius:12,fillColor:'#ffffff',fillOpacity:1,strokeColor:'#165cf5',strokeWeight:2}));}}
statusEl.textContent=lines.length+'개 원본 선 구간 · '+count.toLocaleString()+'개 좌표';}
draw();map.fitBounds(bounds,{left:370,top:35,right:40,bottom:40});
document.getElementById('fit').onclick=()=>map.fitBounds(bounds,{left:370,top:35,right:40,bottom:40});
document.getElementById('route').onchange=()=>{draw();document.getElementById('fit').click()};
document.getElementById('visible').onchange=draw;document.getElementById('stops').onchange=draw;
document.getElementById('sadang').onclick=()=>{map.setCenter(new n.LatLng(37.4766,126.9816));map.setZoom(17)};
document.getElementById('seoul').onclick=()=>{map.setCenter(new n.LatLng(37.5552,126.9726));map.setZoom(17)};
}
init().catch(e=>statusEl.textContent='로딩 실패: '+e.message);
</script></html>
