x-app-environment: &app-environment
  TZ: Asia/Seoul
  POSTGRES_HOST: postgres
  ML_PREDICTOR_URL: http://nextroute-ml-serve:8001
  ML_PREDICTOR_ENABLED: "true"
  LOGGING_LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE: 10MB
  LOGGING_LOGBACK_ROLLINGPOLICY_MAX_HISTORY: "30"
  # OTP shadow 배선(dormant). base URL 은 미리 넣되 토글 2개는 off — 전환은 별건(3값 동시 필요).
  # relaxed binding: routing.otp.base-url / routing.provider.otp-enabled / routing.provider.default-provider.
  ROUTING_OTP_BASE_URL: http://otp:8080
  ROUTING_PROVIDER_OTP_ENABLED: "false"
  ROUTING_PROVIDER_DEFAULT_PROVIDER: ODSAY

x-app-service: &app-service
  env_file:
    - env/db.env
    - env/api.env
    - env/toss.env
    - env/auth.env
    # OAuth provider 설정은 API 로그인과 Worker의 공통 애플리케이션 부팅 검증에 필요하다.
    - env/oauth.env
  volumes:
    - ./logs:/logs
    - /srv/nextroute/toss.p12:/secrets/toss.p12:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 40s
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: postgis/postgis:17-3.5@sha256:81e5819858063884d1146e2239bec61a5056f15dfa848790718b38d7f78683c2
    platform: linux/amd64
    env_file:
      - env/db.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --dbfilename ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    <<: *app-service
    image: ${API_IMAGE:-nextroute:bootstrap}
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: prod,api
      LOGGING_FILE_NAME: /logs/api-${API_BUILD_DATE:-bootstrap}.log
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    <<: *app-service
    image: ${WORKER_IMAGE:-nextroute:bootstrap}
    # FCM 자격증명은 worker 에만 준다. relay 는 worker 프로필 전용이라 API 에 주면 권한만
    # 넓어지고, Firebase 초기화 실패가 API 부팅까지 막는다.
    #
    # ⚠ YAML 병합(<<)은 목록을 이어 붙이지 않고 통째로 덮는다. 그래서 공용 앵커의 항목을 여기
    # 다시 적어야 한다 — 지우면 worker 가 DB·토스 설정을 잃는다.
    env_file:
      - env/db.env
      - env/api.env
      - env/toss.env
      - env/auth.env
      - env/oauth.env
      - env/fcm.env
    volumes:
      - ./logs:/logs
      - /srv/nextroute/toss.p12:/secrets/toss.p12:ro
      - /srv/nextroute/firebase-service-account.json:/secrets/firebase-service-account.json:ro
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: prod,worker
      LOGGING_FILE_NAME: /logs/worker-${WORKER_BUILD_DATE:-bootstrap}.log

  nextroute-ml:
    image: ghcr.io/minsuk330/nextroute-ml:latest
    environment:
      TZ: Asia/Seoul
      POSTGRES_HOST: postgres
      DATA_DIR: /data
      ASOS_STATION: "108"
    env_file:
      - env/db.env
      - env/api.env
    volumes:
      - /srv/nextroute/ml-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nextroute-ml-serve:
    image: ${ML_SERVE_IMAGE:-ghcr.io/minsuk330/nextroute-ml:latest}
    command: uvicorn serve.app:app --host 0.0.0.0 --port 8001
    environment:
      TZ: Asia/Seoul
      ML_MODEL_PATH: /data/model/current
    volumes:
      - /srv/nextroute/ml-data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # OTP 수도권 shadow (dormant). docs/plan/otp-vps-shadow-deploy.
  # ⚠ 최초 shadow 배포 = `docker compose up -d otp` 만. api/worker 는 재생성 금지 —
  #   위 app-environment 의 ROUTING_OTP_* 변경분은 다음 앱 재배포(deploy.sh) 때 자연 반영되고,
  #   토글이 off 라 그때까지 무해하다. 지금 전체 `up -d` 를 돌리면 운영 컨테이너가 재생성된다.
  otp:
    image: ${OTP_IMAGE}   # GHCR digest. .env: OTP_IMAGE=ghcr.io/minsuk330/nextroute-otp@sha256:...
    platform: linux/amd64
    volumes:
      # graph.obj 만 file-mount — dir 통째 mount 하면 이미지에 구운 otp-config.json 이 가려진다.
      - /srv/nextroute/otp/seoul-bbox-202503-cal20260707_20261108-otp276-g4e098383/graph.obj:/var/opentripplanner/graph.obj:ro
    environment:
      TZ: Asia/Seoul
      # -XX:MaxMetaspaceSize 넣지 말 것(관측근거 없음, Metaspace OOM 위험 — codex).
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1900m -XX:+UseG1GC
    mem_limit: 3000m
    memswap_limit: 3000m   # swap 0 — 스래싱으로 이웃 컨테이너 OOM 유발 차단
    ports:
      - "127.0.0.1:18080:8080"   # 호스트 디버그/soak 용. 컨테이너끼리는 내부 DNS(otp:8080).
    healthcheck:
      # 2.10 에서 feeds 는 [Feed] object → {feeds} 는 GraphQL 검증에러(HTTP200 이라 curl 은 성공).
      # {feeds{feedId}} 로 조회하고 feedId 존재 && errors 키 없음 으로 판정. ($ 는 compose 보간 회피로 $$.)
      test: ["CMD-SHELL", "R=$$(curl -sf -X POST http://localhost:8080/otp/routers/default/index/graphql -H 'Content-Type: application/json' -d '{\"query\":\"{feeds{feedId}}\"}') && echo \"$$R\" | grep -q '\"feedId\"' && ! echo \"$$R\" | grep -q '\"errors\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s   # graph load 시간 확보(x86 실측으로 조정)
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
