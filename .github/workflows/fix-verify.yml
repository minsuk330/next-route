name: Fix verify

# 장애 분석기 수정 제안을 main 에 적용해 영향 받는 테스트만 돌리고 결과를 장애 스레드에 답한다
# (docs/plan/pipeline-fix-verify, 파이프라인 5·6단계). 결과는 참고 신호다: 수정 코드가 test job 에서
# 돌므로 위조될 수 있다. 7단계 승인은 사람이 diff 를 보고 한다.
#
# 보안 규칙(PLAN.md):
# - inputs 는 run: 에 직접 쓰지 않고 env 로만 넘긴다(장애 제목 등에 $(...) 가 들어올 수 있음)
# - test job: contents: read, checkout 자격증명 끔, Gradle 캐시 없음, Slack 토큰 없음
# - notify job: 다른 VM, 워크플로 커밋의 코드만 실행, summary.json 은 신뢰 불가 데이터
# - 스크립트(ops/ci)는 워크플로 파일과 같은 커밋(trusted/)에서 읽는다. 분석기는 ref=main 으로 dispatch 한다
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 수정을 적용할 커밋(40자, main 의 조상) — 분석기의 main_sha
        required: true
      edits:
        description: base64(JSON {path, edits:[{search, replace}]})
        required: true
      channel:
        description: Slack 채널 id
        required: true
      thread_ts:
        description: 장애 스레드 ts
        required: true
      label:
        description: 장애 제목(짧게, 표시용)
        required: false
        default: ''
  pull_request:
    paths:
      - '.github/workflows/fix-verify.yml'
      - 'ops/ci/**'

# concurrency 는 job 단위다(7단계 verify #2). 워크플로 단위면 create-pr 의 승인 대기(최대 30일) 동안 같은 스레드의 다음
# run 이 pending 이 되고, 세 번째 run 이 오면 그 pending 이 조용히 취소된다. 요청(스레드)마다 따로 둔다 — 전역 그룹이면
# 대기 칸이 1개라 몰릴 때도 같은 일이 생긴다.

jobs:
  scripts:
    name: ops/ci unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 -I -m unittest discover -s ops/ci/tests -p 'test_*.py'

  test:
    name: Apply fix and run affected tests
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: fix-verify-${{ inputs.thread_ts }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: mydatabase
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        # TCP 로 검사: 이미지가 초기화 중 unix 소켓만 듣는 임시 서버를 띄웠다 재시작한다
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d mydatabase"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      IN_REF: ${{ inputs.ref }}
      EDITS: ${{ inputs.edits }}
    steps:
      # run_tests.py 가 남은 시간을 job 시작부터 센다(60분 timeout 전에 summary 를 써야 함).
      - name: Record start
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out workflow commit (trusted)
        uses: actions/checkout@v5
        with:
          path: trusted
          persist-credentials: false

      - name: Validate inputs
        run: '[[ "$IN_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref 형식 아님"; exit 1; }'

      - name: Check out target
        uses: actions/checkout@v5
        with:
          path: target
          ref: ${{ env.IN_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Target must be on main
        working-directory: target
        run: git merge-base --is-ancestor "$IN_REF" origin/main || { echo "ref 가 main 의 조상이 아님"; exit 1; }

      - name: Apply fix and pick tests
        id: prepare
        run: |
          python3 -I trusted/ops/ci/run_tests.py prepare target out
          if [ -f out/skip ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      # 수정 코드가 돌기 전에 올린다.
      - name: Upload patch
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fix-patch
          path: out/fix.patch
          retention-days: 90

      # 러너 psql(16.x) 대신 서비스 컨테이너의 psql 17 로 복원(pg_dump 17.6+ 의 \restrict 줄 대응).
      - name: Restore prod schema dump
        if: steps.prepare.outputs.skip != 'true'
        env:
          PG_ID: ${{ job.services.postgres.id }}
        run: |
          head -2 trusted/ops/ci/schema.sql
          docker exec -i "$PG_ID" psql -v ON_ERROR_STOP=1 -q -U postgres -d mydatabase -f - < trusted/ops/ci/schema.sql

      - name: Set up Java
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run tests
        if: steps.prepare.outputs.skip != 'true'
        env:
          EDITS: ''
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: mydatabase
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          # 기본값 없는 외부 API 키. 테스트는 실제 호출하지 않는다.
          GONG_API: ci-dummy
          KAKAO_REST_API_KEY: ci-dummy
          SEOUL_BUS_USAGE: ci-dummy
          SEOUL_SUBWAY_MASTER: ci-dummy
          SEOUL_SUBWAY_ROUTE: ci-dummy
        run: python3 -I trusted/ops/ci/run_tests.py test target out

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-summary
          path: out/summary.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/build/test-results/test/*.xml
            baseline/build/test-results/test/*.xml
          retention-days: 14
          if-no-files-found: ignore

  notify:
    name: Reply in the incident thread
    needs: test
    if: always() && github.event_name == 'workflow_dispatch'
    concurrency:
      group: fix-verify-notify-${{ inputs.thread_ts }}
      cancel-in-progress: false
    outputs:
      approvable: ${{ steps.post.outputs.approvable }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out workflow commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: ops/ci

      - name: Download summary
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fix-summary
          path: summary

      # approvable(새 실패 0건)은 Slack 전송 전에 GITHUB_OUTPUT 으로 나간다 — Slack 이 실패해도 승인 대기는 뜬다.
      - name: Post to Slack
        id: post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          THREAD_TS: ${{ inputs.thread_ts }}
          LABEL: ${{ inputs.label }}
          TEST_RESULT: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -I ops/ci/notify_slack.py summary/summary.json --approvable-output

  # 7단계(docs/plan/fix-approval-pr): 새 실패 0건이면 승인 대기 → 승인하면 Draft PR.
  # 쓰기 권한은 이 job 에만. 실행하는 저장소 코드는 워크플로 커밋($GITHUB_SHA)의 ops/ci 스크립트뿐 — 수정 대상 코드는
  # 빌드·실행하지 않는다. fix-patch artifact 는 test job(수정 코드가 돈 곳)이 바꿀 수 있으므로 믿지 않고, 입력 edits 를
  # 다시 적용해 만든 diff 와 대조만 한다.
  create-pr:
    name: Open a draft PR after approval
    needs: [test, notify]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.test.result == 'success' && needs.notify.outputs.approvable == 'true' }}
    environment: fix-approval
    concurrency:
      group: fix-approval-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      IN_REF: ${{ inputs.ref }}
      EDITS: ${{ inputs.edits }}
      BRANCH: fix/alert-${{ github.run_id }}-${{ github.run_attempt }}
      CHANNEL: ${{ inputs.channel }}
      THREAD_TS: ${{ inputs.thread_ts }}
      LABEL: ${{ inputs.label }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out (push needs credentials; no repository code is built or run)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trusted scripts from the workflow commit
        run: |
          for f in apply_edits.py notify_slack.py pr_body.py; do
            git show "$GITHUB_SHA:ops/ci/$f" > "$RUNNER_TEMP/$f"
          done

      - name: Download patch (for comparison only)
        uses: actions/download-artifact@v4
        with:
          name: fix-patch
          path: ${{ runner.temp }}/artifact-patch

      - name: Download summary
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fix-summary
          path: ${{ runner.temp }}/artifact-summary

      - name: Re-apply edits and compare
        id: apply
        run: |
          [[ "$IN_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref 형식 아님"; exit 1; }
          git merge-base --is-ancestor "$IN_REF" origin/main || { echo "ref 가 main 의 조상이 아님"; exit 1; }
          git switch -c "$BRANCH" "$IN_REF"
          changed=$(python3 -I "$RUNNER_TEMP/apply_edits.py" .)
          git diff > "$RUNNER_TEMP/regen.patch"
          if ! cmp -s "$RUNNER_TEMP/regen.patch" "$RUNNER_TEMP/artifact-patch/fix.patch"; then
            echo "다시 만든 diff 가 테스트한 fix-patch 와 다름 — 중단"; exit 1
          fi
          echo "path=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        env:
          CHANGED: ${{ steps.apply.outputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$CHANGED"
          git commit -q -m "fix: AI 제안 수정 (fix-verify $GITHUB_RUN_ID)" -m "$RUN_URL"
          git push -q origin "$BRANCH"
          echo "pushed=true" >> "$GITHUB_ENV"

      - name: Open draft PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I "$RUNNER_TEMP/pr_body.py" "$RUNNER_TEMP/artifact-summary/summary.json" "$RUNNER_TEMP/title" "$RUNNER_TEMP/body"
          url=$(gh pr create --draft --base main --head "$BRANCH" --title "$(cat "$RUNNER_TEMP/title")" --body-file "$RUNNER_TEMP/body")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url"

      - name: Reply with the PR link
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: python3 -I "$RUNNER_TEMP/notify_slack.py" --pr-url "$PR_URL"

      - name: Clean up and report failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ "${pushed:-}" = true ] && [ -z "$PR_URL" ]; then
            git push -q origin --delete "$BRANCH" || true
          fi
          python3 -I "$RUNNER_TEMP/notify_slack.py" --pr-failed || true
