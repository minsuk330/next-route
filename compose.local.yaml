services:
  postgres:
    image: postgis/postgis:17-3.5
    ports: !override
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      args:
        JAR_FILE: build/libs/nextroute-0.0.1-SNAPSHOT.jar
    image: nextroute:local
    environment:
      SPRING_PROFILES_ACTIVE: dev,api
      LOGGING_FILE_NAME: /logs/api-local.log
      MANAGEMENT_SERVER_PORT: "8081"
    volumes: !override
      - ./logs:/logs
    ports: !override
      - "8080:8080"

  worker:
    build:
      context: .
      args:
        JAR_FILE: build/libs/nextroute-0.0.1-SNAPSHOT.jar
    image: nextroute:local
    profiles: ["worker"]
    environment:
      SPRING_PROFILES_ACTIVE: dev,worker
      LOGGING_FILE_NAME: /logs/worker-local.log
      MANAGEMENT_SERVER_PORT: "8081"
    volumes: !override
      - ./logs:/logs

  nextroute-ml:
    build: ./ml
    profiles: ["ml"]
    volumes: !override
      - ./ml/data:/data

  nextroute-ml-serve:
    build: ./ml
    profiles: ["ml"]
    environment:
      ML_MODEL_PATH: ${ML_MODEL_PATH:-}
    volumes: !override
      - ./ml/data:/data:ro
    ports:
      - "8001:8001"
