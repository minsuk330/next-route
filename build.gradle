plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.11'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'watoo.grd'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	// BuildInfoMetricsTest 가 실제 Prometheus 노출 이름(app_build)을 scrape 로 확인한다.
	testImplementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
	// 여정 알림 push 발송(Phase 5 ③). APNs 를 직접 부르지 않는다 — iOS 전달은 Firebase 프로젝트에
	// APNs 키를 연결해 처리한다.
	implementation 'com.google.firebase:firebase-admin:9.10.0'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
	// 통합 테스트가 Spring 컨텍스트를 여러 벌 띄우고, 그것들은 캐시돼 실행 내내 살아 있다.
	// 기본 힙으로는 컨텍스트가 늘어날 때 OutOfMemoryError 가 나는데, 그 오류가 엉뚱한 테스트
	// 클래스의 "컨텍스트 로드 실패"로 나타나 원인을 찾기 어렵다.
	maxHeapSize = '2g'
}

// 배포 커밋을 jar 에 굽는다(META-INF/build-info.properties → BuildProperties → app_build 메트릭).
// 장애 분석기가 이 40자 커밋으로 GitHub 에서 그 시점 코드를 받는다(docs/plan/rag-incident-context).
// deploy.sh 의 revision 은 짧은 SHA·manual·운영자 입력이라 쓰지 않는다. git 이 없거나 실패하면 unknown.
def gitOutput = { List<String> args ->
	try {
		return providers.exec {
			commandLine(['git'] + args)
			ignoreExitValue = true
		}.standardOutput.asText.get().trim()
	} catch (Exception ignored) {
		return ''
	}
}
def gitRevision = gitOutput(['rev-parse', 'HEAD'])
// 소스·빌드 설정에 커밋 안 된 변경(추적 안 하는 새 파일 포함)이 있으면 그 커밋과 jar 가 다르다.
def gitDirty = gitOutput(['status', '--porcelain', '--', 'src', 'build.gradle', 'settings.gradle'])

springBoot {
	buildInfo {
		properties {
			additional = [
				revision: (gitRevision ==~ /[0-9a-f]{40}/) ? gitRevision : 'unknown',
				dirty   : gitDirty.isEmpty() ? 'false' : 'true'
			]
		}
	}
}
