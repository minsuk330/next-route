# OTP 2.9.0 GTFS GraphQL — 수도권 planConnection (national-otp P2-B).
# stable 필드만 사용(deprecated startTime/endTime/intermediatePlaces 회피, schema.graphqls 검증).
# 변수: origin/destination(PlanLabeledLocationInput), when(OffsetDateTime, offset 포함 확정 departureAt), first(Int),
#       searchWindow(Duration, null=OTP 동적 창), modes(PlanModesInput, null=전 수단 기본 비용),
#       preferences(PlanPreferencesInput, null=기본. 급행 끄기는 transit.filters[].exclude.routes, subway-express S2).
# trip.pattern.code = 같은 정차 순서 trip 묶음(급행 판정 근거 보존용, 판정은 RailServiceClassifier).
# nextLegs = 같은 승차 정류장의 다른 편(다른 노선 포함, 버스는 정확히 같은 정류장). withAlternatives 일 때만(otp-bus-lane-merge).
# generalizedCost = 앱 후보 정렬 키(ItineraryRanker). OTP 기본 순서는 도착시각 타임라인이다.
query PlanConnection(
  $origin: PlanLabeledLocationInput!
  $destination: PlanLabeledLocationInput!
  $when: OffsetDateTime!
  $first: Int!
  $searchWindow: Duration
  $modes: PlanModesInput
  $preferences: PlanPreferencesInput
  $withAlternatives: Boolean! = false
  $alternativeLegs: Int! = 0
) {
  planConnection(
    origin: $origin
    destination: $destination
    dateTime: { earliestDeparture: $when }
    first: $first
    searchWindow: $searchWindow
    modes: $modes
    preferences: $preferences
  ) {
    edges {
      node {
        duration
        waitingTime
        walkDistance
        walkTime
        numberOfTransfers
        generalizedCost
        legs {
          mode
          duration
          distance
          start { scheduledTime }
          end { scheduledTime }
          from { name lat lon stop { gtfsId } }
          to { name lat lon stop { gtfsId } }
          route {
            gtfsId
            shortName
            longName
            mode
            color
            textColor
            agency { gtfsId name }
          }
          trip { gtfsId pattern { code } }
          stopCalls {
            stopLocation {
              __typename
              ... on Stop { gtfsId name lat lon }
            }
            schedule { time { ... on ArrivalDepartureTime { arrival departure } } }
          }
          steps { distance relativeDirection streetName }
          legGeometry { length points }
          fareProducts { id product { name } }
          nextLegs(numberOfLegs: $alternativeLegs) @include(if: $withAlternatives) {
            mode
            start { scheduledTime }
            end { scheduledTime }
            to { stop { gtfsId } }
            route { gtfsId shortName color }
            stopCalls { stopLocation { ... on Stop { gtfsId } } }
          }
        }
      }
    }
    routingErrors { code description }
  }
}
