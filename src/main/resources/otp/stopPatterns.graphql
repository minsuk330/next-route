# OTP 2.9.0 GTFS GraphQL — 정류장에서 실제로 탈 수 있는 노선 pattern (national-otp P2-F PR-4).
# stop.patterns(topology)가 아니라 stoptimesForPatterns 를 쓰는 이유(사용자 방향 확정 2026-09-10):
#   patterns 는 "이 정류장을 지나는" 노선만 준다 — 여기서 승차 가능한지·오늘 운행하는지는 모른다.
#   stoptimesForPatterns 는 실제 출발편을 pattern 별로 묶어 주며, 아래 두 플래그로 OTP 가 미리 거른다:
#     omitNonPickups:true → 이 정류장에서 승차 가능한(pickup 허용) pattern 만
#     omitCanceled:true   → 취소편 제외. timeRange 안에 출발편이 있어야 나오므로 오늘 미운행 노선도 빠짐
#   → 승차금지/하차전용/미운행 검증(codex B6)을 우리 코드가 아니라 OTP 가 한다.
# pattern.stops 순서는 방향 판정용(승차 index < 하차 index)으로 소비처(PR-4)가 쓴다.
# directionId 는 KTDB direction_id 부재라 전 노선 -1 — 신뢰하지 않는다(위 stops 순서로 판정).
# 변수: id(Stop gtfsId, 예 "1:BS_TAGO_SEB101000041").
query StopPatterns($id: String!) {
  stop(id: $id) {
    gtfsId
    stoptimesForPatterns(omitNonPickups: true, omitCanceled: true, numberOfDepartures: 1, timeRange: 86400) {
      pattern {
        route {
          gtfsId
          shortName
        }
        directionId
        stops {
          gtfsId
        }
      }
    }
  }
}
