spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate

# actuator를 별도 management 포트로 격리 (compose에서 미publish → Docker 내부망 전용).
# app 8080은 anyRequest().permitAll() + 공개 포트라 actuator를 8080에 노출하면 인터넷 공개됨.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  # 분산 트레이싱: 전량 샘플링 → OTLP(HTTP)로 Tempo 전송(nextroute_default 경유).
  # Spring Boot 3.5 기본 OTLP 전송은 HTTP(포트 4318, /v1/traces). Tempo는 http+grpc 수신.
  # traceId/spanId는 bridge-otel이 MDC에 자동 주입 → 위 logstash JSON 로그에 자동 포함(추가 설정 불필요).
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://tempo:4318/v1/traces

logging:
  level:
    watoo.grd.nextroute: INFO
  file:
    name: logs/nextroute.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
  # 콘솔(=docker json-file 로그)만 JSON 구조화 → Alloy가 level/필드 파싱. 파일 로그는 텍스트 유지.
  structured:
    format:
      console: logstash

collector:
  bus-arrival:
    enabled: true
  bus-position:
    enabled: true
  route-rotation:
    enabled: true

realtime:
  subway:
    enabled: true
    persist-raw-arrivals: false

notification:
  bus-arrival:
    enabled: true

batch:
  arrival-event:
    enabled: true
  match-issue:
    enabled: true
  inferred-completion:
    enabled: true
  delay-truth:
    enabled: true
  bus-label:
    enabled: true

ml:
  predictor:
    enabled: ${ML_PREDICTOR_ENABLED:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
