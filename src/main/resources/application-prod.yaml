spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate

# actuator를 별도 management 포트로 격리 (compose에서 미publish → Docker 내부망 전용).
# app 8080은 anyRequest().permitAll() + 공개 포트라 actuator를 8080에 노출하면 인터넷 공개됨.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: prometheus,health,info

logging:
  level:
    watoo.grd.nextroute: INFO
  file:
    name: logs/nextroute.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
  # 콘솔(=docker json-file 로그)만 JSON 구조화 → Alloy가 level/필드 파싱. 파일 로그는 텍스트 유지.
  structured:
    format:
      console: logstash

collector:
  bus-arrival:
    enabled: true
  bus-position:
    enabled: true
  route-rotation:
    enabled: true

realtime:
  subway:
    enabled: true
    persist-raw-arrivals: false

notification:
  bus-arrival:
    enabled: true

batch:
  arrival-event:
    enabled: true
  match-issue:
    enabled: true
  inferred-completion:
    enabled: true
  delay-truth:
    enabled: true
  bus-label:
    enabled: true

ml:
  predictor:
    enabled: ${ML_PREDICTOR_ENABLED:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
