spring:
  profiles:
    default: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import:
      - optional:file:./env/db.env[.properties]
      - optional:file:./env/api.env[.properties]
      - optional:file:./env/toss.env[.properties]
      - optional:file:./env/auth.env[.properties]
      - optional:file:./env/oauth.env[.properties]
  application:
    name: nextroute
  task:
    scheduling:
      pool:
        size: 3   # 공용 스케줄러 풀(수집/배치/로테이션 등). 알림 잡은 전용 풀로 격리(SchedulingConfig)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 1000ms

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mydatabase}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # ddl-auto / flyway baseline 등 환경별 값은 application-{dev,prod}.yaml 참고
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 1000
        # bulk insert/update 튜닝 — chunk saveAll 처리량 향상.
        # 같은 entity 종류의 SQL을 batch 단위로 묶어 JDBC에 전송한다.
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        # batch_versioned_data: 버전 컬럼이 있는 entity 업데이트도 batch 가능.
        # ml_subway_delay_truth / subway_arrival_event_match_issue는 멱등성 위해
        # delete-and-insert만 사용하므로 update batch는 영향 미미. 안전 차원에서 on.
        batch_versioned_data: true
    open-in-view: false

odsay:
  api:
    key: ${ODSAY_API_KEY:test}
    base-url: https://api.odsay.com/v1/api

tmap:
  app-key: ${TMAP_APP_KEY:test}
  base-url: https://apis.openapi.sk.com
  timeout-ms: 1500
  retry-on-failure: true

ml:
  predictor:
    base-url: ${ML_PREDICTOR_URL:http://localhost:8001}
    # enabled 는 application-{dev,prod}.yaml 에서 설정
    timeout-ms: 3000
    # 예측 결과 캐시. 키가 feature 값 전체라 상류 위치 캐시가 갱신되면 저절로 무효화된다.
    # 0 이하면 캐시 우회. 효율은 route.transfer-arrival.cache-ttl-seconds 에 매달린다.
    cache-ttl-seconds: ${ML_PREDICTION_CACHE_TTL:30}

route:
  transfer-arrival:
    enabled: ${TRANSFER_ARRIVAL_ENABLED:true}
    deadline-ms: ${TRANSFER_ARRIVAL_DEADLINE_MS:1500}
    cache-ttl-seconds: ${TRANSFER_ARRIVAL_CACHE_TTL:15}
    max-concurrent-external-calls: ${TRANSFER_ARRIVAL_MAX_CONCURRENT:8}
    external-call-acquire-ms: ${TRANSFER_ARRIVAL_ACQUIRE_MS:500}
    max-external-calls-per-search: ${TRANSFER_ARRIVAL_MAX_CALLS:12}

  # 경로 검색 시간 예산·격리. 값 선정 근거는 docs/plan/route-search-resilience/RESULTS.md
  search:
    deadline-ms: ${ROUTE_SEARCH_DEADLINE_MS:3000}
    odsay-ms: ${ROUTE_SEARCH_ODSAY_MS:2000}
    tmap-ms: ${ROUTE_SEARCH_TMAP_MS:1200}
    min-remaining-for-optional-ms: ${ROUTE_SEARCH_MIN_REMAINING_MS:150}
    tmap-pool:
      size: ${ROUTE_SEARCH_TMAP_POOL_SIZE:8}
      queue: ${ROUTE_SEARCH_TMAP_POOL_QUEUE:16}
    bus:
      join-wait-ms: ${ROUTE_SEARCH_BUS_JOIN_WAIT_MS:1800}
    # 사용자별 검색 이력 저장(비동기 전용 풀). 저장은 best-effort — 포화·실패는 drop metric.
    history:
      max-per-user: ${ROUTE_SEARCH_HISTORY_MAX_PER_USER:50}
      executor:
        core-size: ${ROUTE_SEARCH_HISTORY_CORE:2}
        max-size: ${ROUTE_SEARCH_HISTORY_MAX:4}
        queue-capacity: ${ROUTE_SEARCH_HISTORY_QUEUE:500}

  # 검색 결과 스냅샷(여정 시작이 searchSessionId+pathKey 만 받게 하려는 준비).
  # 저장은 best-effort — 실패해도 검색은 200 이고 meta.degraded 에 journey_snapshot 만 남는다.
  snapshot:
    enabled: ${ROUTE_SNAPSHOT_ENABLED:true}
    ttl-seconds: ${ROUTE_SNAPSHOT_TTL_SECONDS:600}

transfer:
  predict:
    deadline-ms: ${TRANSFER_PREDICT_DEADLINE_MS:2500}
    max-future-minutes: ${TRANSFER_PREDICT_MAX_FUTURE_MIN:40}
    past-grace-seconds: ${TRANSFER_PREDICT_PAST_GRACE_SEC:60}

bus:
  quota:
    search:
      # collector 몫(collector.bus-*.daily-budget)과 합이 provider 일일 한도를 넘지 않게 설정
      arrival: ${SEARCH_QUOTA_ARRIVAL:5000}
      position: ${SEARCH_QUOTA_POSITION:5000}

kakao:
  api:
    key: ${KAKAO_REST_API_KEY}
  map:
    js-key: ${KAKAO_MAP_JS_KEY:}
gong:
  api:
    key: ${GONG_API}
# 기상청 초단기실황(getUltraSrtNcst) — ML serving 날씨 feature. 키는 gong.api.key(GONG_API) 재사용.
kma:
  weather:
    enabled: ${KMA_WEATHER_ENABLED:true}
    nx: ${KMA_WEATHER_NX:60}    # 서울
    ny: ${KMA_WEATHER_NY:127}   # 서울
    poll-ms: ${KMA_WEATHER_POLL_MS:600000}
seoul:
  api:
    bus-key: ${SEOUL_BUS_API:test}
    bus-base-url: http://ws.bus.go.kr/api/rest
    bus-route-key: ${SEOUL_BUS_ROUTE:test}
    seoul-bus-use-key: ${SEOUL_BUS_USAGE}
    seoul-base-api-url: http://openapi.seoul.go.kr:8088
    subway-key: ${SEOUL_SUBWAY_API:test}
    subway-base-url: http://swopenAPI.seoul.go.kr/api/subway
    subway-arrival-key: ${SEOUL_SUBWAY_ARRIVAL:test}
    subway-master-key: ${SEOUL_SUBWAY_MASTER}
    subway-route-key: ${SEOUL_SUBWAY_ROUTE}
    subway-tago-base-url: http://apis.data.go.kr/1613000/SubwayInfo

toss:
  login:
    base-url: ${TOSS_LOGIN_BASE_URL:https://apps-in-toss-api.toss.im}
    # mTLS 클라이언트 인증서(PKCS12). 미설정 시 토스 서버통신 실패(부팅은 됨)
    key-store-path: ${TOSS_MTLS_KEYSTORE_PATH:}
    key-store-password: ${TOSS_MTLS_KEYSTORE_PASSWORD:}
    trust-store-path: ${TOSS_MTLS_TRUSTSTORE_PATH:}
    trust-store-password: ${TOSS_MTLS_TRUSTSTORE_PASSWORD:}
    # 사용자정보 PII 복호화 키(Base64) + AAD. 콘솔→이메일 수신
    decrypt-key: ${TOSS_DECRYPT_KEY:}
    aad: ${TOSS_DECRYPT_AAD:TOSS}
    # 연결끊기 콜백 Basic Auth
    callback-username: ${TOSS_CALLBACK_USERNAME:}
    callback-password: ${TOSS_CALLBACK_PASSWORD:}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    max-retries: 3
  messenger:
    # 알림 종류별 서버 send-message 템플릿 세트 코드(값은 운영서 env 주입).
    bus-arrival-template-set-code: ${TOSS_BUS_ARRIVAL_TEMPLATE_SET:}
    route-departure-template-set-code: ${TOSS_ROUTE_DEPARTURE_TEMPLATE_SET:}
    route-change-template-set-code: ${TOSS_ROUTE_CHANGE_TEMPLATE_SET:}

notification:
  bus-arrival:
    # enabled 는 application-{dev,prod}.yaml 에서 설정. 발송은 항상 outbox 경로(polling=enqueue, relay=send).
    poll-interval-ms: 1000          # 폴링=enqueue 만(Toss 미호출)이라 고빈도 가능
    outbox-sweep-interval-ms: 1000  # relay fallback sweep(평소엔 enqueue afterCommit wake 로 즉시 발송)
    outbox-relay-workers: 4         # 발송 병렬도(Step C)
    threshold-seconds: 120
    ttl-minutes: 60
    batch-size: 200
    claim-timeout-minutes: 3
    max-attempts: 3
    per-user-cycle-cap: 5
    backoff-seconds: 60
    # 발송조건 판단 시 실시간 관측 캐시 재사용(Step E). on 이면 collector/검색과 캐시 공유로 busApiCalls 절감. 기본 off.
    cache-read-enabled: false
    active-hours:
      start: "05:00"
      end: "01:00"
  scheduler:
    # 알림 전용 스케줄러 풀(noti-sched-). 공용 풀 포화와 무관하게 도착 알림 정시 실행(Step D 격리).
    pool-size: 2

auth:
  jwt:
    # 기본값을 두지 않는다. 없으면 부팅 시 명시적으로 실패한다(env/auth.env.example 참고).
    secret: ${AUTH_JWT_SECRET:}
    issuer: ${AUTH_JWT_ISSUER:nextroute}
    access-ttl-seconds: ${AUTH_JWT_ACCESS_TTL:3600}
    refresh-ttl-seconds: ${AUTH_JWT_REFRESH_TTL:1209600}
  admin:
    # /api/admin/** 보호 시크릿. 공백이면 admin 전부 401(fail-closed). ops가 X-Admin-Key 헤더로 인증.
    api-key: ${ADMIN_API_KEY:}

# 앱 OAuth provider. 값은 env/oauth.env 로 주입한다(env/oauth.env.example 참고).
# audiences 가 비면 부팅을 막는다 — 빈 목록이 "전부 통과"로 동작하면 검증이 없는 것과 같다.
oauth:
  apple:
    jwk-set-uri: ${OAUTH_APPLE_JWK_SET_URI:https://appleid.apple.com/auth/keys}
    issuer: ${OAUTH_APPLE_ISSUER:https://appleid.apple.com}
    audiences: ${OAUTH_APPLE_AUDIENCES:}
  kakao:
    # 토큰이 우리 앱을 위해 발급됐는지 확인한다(애플의 aud 검사에 해당).
    token-info-uri: ${OAUTH_KAKAO_TOKEN_INFO_URI:https://kapi.kakao.com/v1/user/access_token_info}
    user-info-uri: ${OAUTH_KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
    app-id: ${OAUTH_KAKAO_APP_ID:}
  # 애플 일회용 값(challenge) 보관 시간. 서버가 발급하고 로그인 때 한 번만 소비한다.
  challenge:
    ttl-seconds: ${OAUTH_CHALLENGE_TTL_SECONDS:300}



collector:
  # *.enabled 는 application-{dev,prod}.yaml 에서 설정
  bus-arrival:
    cron: "0 * * * * *"
    # 수집 도착정보를 실시간 캐시에 프라이밍(노선×정류장 쓰기량 많음 — 기본 off, 검증 후 on).
    prime-realtime-cache: ${COLLECTOR_ARR_PRIME_CACHE:false}
    active-hours:
      start: "03:30"
      end: "02:30"
    finalize-miss-threshold: 2
    stale-threshold-minutes: 5
    included-arrival-orders:
      - 1
    excluded-arrival-messages:
      - "출발대기"
    daily-budget: 50000
    target-route-names:
      - "143"
      - "272"
      - "160"
      - "271"
      - "130"
      - "273"
      - "163"
      - "150"
      - "152"
      - "147"
      - "360"
      - "340"
      - "142"
      - "140"
      - "146"
      - "5531"
      - "202"
      - "120"
      - "420"
      - "421"
      - "641"
      - "동작01"
      - "303"
      - "262"
      - "144"
      - "301"
      - "5524"
      - "370"
      - "4318"
      - "720"

  bus-position:
    cron: "0 * * * * *"
    # 수집 위치를 실시간 캐시에 프라이밍(노선당 1키, 저렴 — 기본 on).
    prime-realtime-cache: ${COLLECTOR_POS_PRIME_CACHE:true}
    # 도착 수집과 독립 예산. 30노선 × 분당 × active-hours(23h) ≈ 41,400 호출/일.
    daily-budget: 50000
    active-hours:
      start: "03:30"
      end: "02:30"

  # 주간 노선 로테이션: 매주 다음 30개 bucket으로 수집 대상 교체.
  # enabled 는 application-{dev,prod}.yaml 에서 설정(기본 false).
  route-rotation:
    cron: "0 0 4 * * MON"
    ridership-month: "202603"
    limit: 30
    page-size: 1000

  subway-arrival: # DEPRECATED
    enabled: false
    cron: "0 */1 * * * *"
    flush-cron: "0 */30 * * * *"
    reset-cron: "0 0 5 * * *"
  static-data:
    enabled: ${STATIC_DATA_ENABLED:true}
    cron: "0 0 3 * * *"
    bus-route-polyline-request-interval-ms: ${BUS_ROUTE_POLYLINE_REQUEST_INTERVAL_MS:200}


# logging / cors 는 application-{dev,prod}.yaml 에서 설정

realtime:
  subway:
    # enabled / persist-raw-arrivals 는 application-{dev,prod}.yaml 에서 설정
    poll-interval-ms: 1000
    active-hours:
      start: "04:30"
      end: "01:00"
    snapshot-ttl-seconds: 20
    # 역별 실시간 조회(수집기 캐시가 비었을 때 쓰는 경로) 캐시. 여정 평가가 같은 역을 여러 번
    # 묻는 것을 합친다. 남은 시간은 응답의 receivedAt 으로 보정되므로 캐시가 값을 부풀리지 않는다.
    station-arrival:
      cache-ttl-seconds: ${SUBWAY_STATION_ARRIVAL_CACHE_TTL:10}
      join-wait-ms: ${SUBWAY_STATION_ARRIVAL_JOIN_WAIT_MS:1000}

batch:
  # *.enabled 는 application-{dev,prod}.yaml 에서 설정
  inferred-completion:
    line-ids: "1002,1005,1006,1007"
    dedup-window-minutes: 5
  delay-truth:
    # v1: legacy ORDINAL 강제 매칭 + OUTLIER_DELAY 학습 제외
    # v2: count guard + 30분 time-window + known-known destination hard reject
    matching-version: v2
    # V2 시간창. |delay| 초과 시 group-level reject → truth row 미생성, issue로만 저장
    max-match-distance-seconds: 1800
  persistence:
    # 일자 단위 issue/truth bulk insert chunk 크기. heap bloat 방지를 위해 chunk 저장 후
    # SubwayDataService.flushAndClear()로 1차 캐시를 비운다.
    issue-chunk-size: 1000
    truth-chunk-size: 2000
    bus-label-chunk-size: 2000
  bus-label:
    correction-window-minutes: 10

journey:
  navigation:
    # 만료 판정 기준(lease 180초 + 유예 120초)·지하철 보호 상한은 JourneyNavigationProperties 의
    # 기본값을 쓴다. 여기 있는 값은 "얼마나 자주, 몇 건씩 훑을지"뿐이다.
    expiry:
      # 만료가 정상 사용자의 여정을 접는 상황이면 배포를 기다리지 않고 끈다. worker 프로필에서만 돈다.
      enabled: ${JOURNEY_EXPIRY_ENABLED:true}
      interval-ms: ${JOURNEY_EXPIRY_INTERVAL_MS:30000}
      batch-size: 200
      max-sweeps-per-tick: 5
    evaluator:
      # 기본 꺼짐. 평가기는 외부 API 를 상시로 부르므로 배포와 동시에 돌지 않게 한다.
      # 켜는 시점은 운영이 고른다(Phase 8 점진 배포가 이 스위치를 쓴다). worker 프로필 전용.
      enabled: ${JOURNEY_EVALUATOR_ENABLED:false}
      # 처리량 상한 = batch-size ÷ tick-ms. 100건/5초(20건/s)는 여정 1,000건에서도 적체가
      # 쌓였다(⑧ 측정: p95 33초). 200건/1초로 올려 상한을 200건/s 로 둔다.
      # 더 올리려면 워커 수와 평가기 provider 슬롯을 함께 봐야 한다 — 지금은 그쪽이 먼저 막힌다.
      tick-ms: ${JOURNEY_EVALUATOR_TICK_MS:1000}
      batch-size: ${JOURNEY_EVALUATOR_BATCH_SIZE:200}
      # lease > interval 이어야 한다. 짧으면 평가가 끝나기 전에 다른 워커가 같은 여정을 잡아
      # 둘이 번갈아 서로의 결과를 버린다.
      interval-seconds: 30
      lease-seconds: 60
      jitter-seconds: 7
      batch-deadline-ms: 4000
      # 버스 실시간 시야. 이 안에 탈 예정이면 실시간 → 모델, 그 밖이면 모델만 쓴다.
      # 도착 API 는 다음 한두 대만 알려 주므로 먼 미래의 차량은 애초에 목록에 없다.
      # 지하철은 시야를 두지 않는다 — 실시간 조회에 호출량 제한이 없어 매번 묻는다.
      bus-realtime-window-seconds: ${JOURNEY_EVALUATOR_BUS_REALTIME_WINDOW_SECONDS:1200}
      # 저장된 판정을 믿어 주는 상한. 낡음의 1차 기준은 "가리키는 도착 시각이 지났는가"이고,
      # 이 값은 평가기가 멈춘 채 먼 미래를 가리키는 값이 최신인 척하는 것을 막는 안전망이다.
      stale-after-seconds: 300
      # 상황별 평가 간격. 환승이 임박하거나 위험하면 min, 멀거나 없으면 idle, 그 사이는 기본값.
      # max 는 stale-after-seconds 보다 반드시 짧아야 한다 — 길면 조회가 그 판정을 낡았다고
      # 버려서 평가기가 정상인데도 앱에 "모름"이 뜬다(부팅 시 검증한다).
      min-interval-seconds: ${JOURNEY_EVALUATOR_MIN_INTERVAL_SECONDS:10}
      max-interval-seconds: ${JOURNEY_EVALUATOR_MAX_INTERVAL_SECONDS:180}
      idle-interval-seconds: ${JOURNEY_EVALUATOR_IDLE_INTERVAL_SECONDS:120}
      near-transfer-seconds: ${JOURNEY_EVALUATOR_NEAR_TRANSFER_SECONDS:300}
      far-transfer-seconds: ${JOURNEY_EVALUATOR_FAR_TRANSFER_SECONDS:900}
      unchanged-backoff-multiplier: ${JOURNEY_EVALUATOR_UNCHANGED_BACKOFF:2}
      pool-size: 4
      # batch-size 보다 작으면 선점해 놓고 큐에서 거부되는 여정이 생긴다(부팅 검증으로 막는다).
      queue-capacity: ${JOURNEY_EVALUATOR_QUEUE_CAPACITY:400}
      # 평가기가 사용자 요청 자원을 밀어내지 않게 하는 값들.
      # provider-permits 는 워커 스레드 수와 별개로 "평가기가 동시에 외부 API 를 부를 수 있는 수"다.
      # pool-size 를 올려도 검색 요청이 쓰는 공용 Semaphore(permit 8) 몫이 줄지 않게 한다.
      provider-permits: ${JOURNEY_EVALUATOR_PROVIDER_PERMITS:4}
      provider-acquire-ms: ${JOURNEY_EVALUATOR_PROVIDER_ACQUIRE_MS:300}
      # 환승 예측 한 건의 예산. 검색용 2500ms 보다 짧다 — 기다리는 사용자가 없다.
      # 두 배가 batch-deadline-ms 를 넘으면 부팅을 막는다(환승 두 개짜리 여정 기준).
      predict-deadline-ms: ${JOURNEY_EVALUATOR_PREDICT_DEADLINE_MS:1500}
      # provider 가 답을 못 줘도 이 시간 안에는 직전 판정을 유지한다. stale-after-seconds 이하여야 한다.
      unknown-grace-seconds: ${JOURNEY_EVALUATOR_UNKNOWN_GRACE_SECONDS:120}
  reroute:
    # 기본 꺼짐. 트리거(①)와 후보 생성기(③④)가 붙기 전에는 켜도 후보가 0개라 아무 일이 없지만,
    # 스위치는 그것들보다 먼저 있어야 한다. 꺼져 있으면 조회는 빈 결과, 요청은 disabled 로 거절.
    enabled: ${JOURNEY_REROUTE_ENABLED:false}
    # 제안 유효시간. 넘기면 근거로 삼은 실시간 값이 이미 다른 이야기를 한다.
    proposal-ttl: PT2M
    max-candidates: 3
    expiry:
      # lazy 전이(조회·생성·수락)를 아무도 지나가지 않을 때의 그물. TTL 의 절반 주기다.
      # worker 프로필 전용.
      interval-ms: ${JOURNEY_REROUTE_EXPIRY_INTERVAL_MS:60000}
      batch-size: 200
      max-sweeps-per-tick: 5
    trigger:
      # "언제 찾아볼지" 판정. shadow 다 - 방아쇠가 켜져도 지표·로그만 남고 제안도 외부 호출도
      # 만들어지지 않는다. 위 enabled(기능 플래그)와 다른 스위치인 것이 의도다:
      # 방아쇠는 기능이 꺼져 있는 동안 발생률을 재는 것이 일이라, 둘을 묶으면 아무것도 못 잰다.
      # 켜 두는 것이 기본값인 이유 - 하루에 몇 번 도는지 모르는 채로 ③을 켜면 요금이 먼저 온다.
      enabled: ${JOURNEY_REROUTE_TRIGGER_ENABLED:true}
      # 문(decision window). 환승 준비 시각까지 이 안이면 찾아봐도 되는 구간으로 본다.
      # 이것만으로는 아무 일도 일어나지 않는다 - 실제로 찾게 만드는 것은 방아쇠다.
      decision-window-seconds: 600
      # 같은 환승에서 다시 찾기까지의 최소 간격. 0 이면 cooldown 없이 원시 발생률만 잰다.
      # 키는 용도별로 갈린다(trigger/request) - shadow 방아쇠가 사용자 요청 잠금을 태우면
      # 아무것도 만들지 않는 셈 때문에 실제 요청이 2분간 거절된다.
      cooldown: PT2M
    route-option:
      # 같은 정류장의 다른 노선을 후보로 올리는 판정(③). 값이 전부 요금과 대기시간 이야기다 -
      # 후보 하나마다 실시간·ML 조회가 나가고 사용자는 그 응답을 화면에서 기다린다.
      # 이만큼 빨라지지 않으면 제안하지 않는다. 낮추면 예측 오차보다 작은 차이가 제안이 된다.
      minimum-eta-gain-seconds: 300
      # 예측을 물어볼 대안 노선 수 상한(기준선 제외). 후보 하나가 최대 1500ms 라 5 면 9초가 된다.
      max-evaluations: 3
      # 대안 평가의 누적 시간 예산. 넘으면 남은 후보를 건너뛰고 이미 평가한 것으로 제안한다 -
      # 부분 결과가 빈손보다 낫다. 남은 예산은 다음 호출의 상한으로도 쓴다(마감 직전에 시작한
      # 호출이 예산을 넘기지 않게). 기준선 평가는 여기서 빼지 않으므로, 요청 하나의 최악 대기는
      # journey.evaluator.predict-deadline-ms(기준선 1회) + 이 값이다.
      evaluation-budget-ms: 3000
  notification:
    # 알림만 끄는 스위치. 평가기는 그대로 돌고 outbox 에 쌓지만 않는다.
    enqueue-enabled: ${JOURNEY_NOTIFICATION_ENQUEUE_ENABLED:true}
    # 발송 구현. fcm 은 worker 에서만 올린다(자격증명이 거기에만 있다).
    # relay 를 켠 채 noop 이면 부팅을 막는다 — 진짜 알림 행을 아무 데도 보내지 않고 SENT 로
    # 소모해 나중 발송을 영영 막기 때문이다.
    sender: ${JOURNEY_NOTIFICATION_SENDER:noop}
    # 채널 결정. 여정 알림은 PUSH 하나다(TECHNICAL_DECISIONS §2 LOCKED).
    channel-resolver: ${JOURNEY_NOTIFICATION_CHANNEL_RESOLVER:fixed}
    fixed-channels: PUSH
    # 유효시간. MISSED 는 "다음 차 도착이 이미 과거"라는 뜻이라 그대로 쓰면 삽입 순간 만료다.
    # 바닥 180초 = 백오프 60초 × 최대 3회 — 만료 바닥에 걸린 행도 재시도를 다 쓸 수 있어야 한다.
    min-ttl-seconds: 180
    default-ttl-seconds: 600
    max-ttl-seconds: 1800
    max-attempts: 3
    backoff-seconds: 60
    # 이 시간을 넘겨 PROCESSING 인 행은 워커가 죽은 것으로 보고 회수한다.
    # sender 는 자체 타임아웃을 이 값보다 짧게 둘 의무가 있다(fcm.timeout-ms 를 부팅에서 검증).
    claim-timeout-minutes: 3
    fcm:
      # 서비스 계정 JSON 의 경로. sender=fcm 인데 비면 부팅을 막는다.
      # worker 컨테이너에만 읽기 전용으로 마운트한다(compose.yaml).
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
      # 발송 한 건의 예산. SDK 기본 타임아웃은 회수 주기보다 길 수 있고, 그러면 아직 발송 중인
      # 행을 회수 루프가 다시 집어 가 같은 알림이 두 번 나간다(부팅에서 검증한다).
      timeout-ms: 5000
      # provider 가 메시지를 들고 있을 시간의 천장. max-ttl-seconds 이하여야 한다.
      ttl-max-seconds: 1800
    approach:
      # "갈아탈 차가 곧 온다"(N2)만 끄는 스위치. 위험 알림은 그대로 간다.
      enabled: ${JOURNEY_NOTIFICATION_APPROACH_ENABLED:true}
      # 이 시간 안에 도착하면 곧 온다고 본다. 이 값이 N2 의 유효시간 상한이기도 하다 —
      # 접근 알림은 바닥·천장 clamp 없이 다음 차 도착 시각을 그대로 만료로 쓴다.
      window-seconds: 120
    relay:
      # 기본 꺼짐. 발송 구현은 붙었지만 ⑤(발송 직전 재검증)와 ⑥(payload 계약·문구)이 들어오기
      # 전에는 켜지 않는다 — 낡은 알림이 나가고 임시 문구가 운영에 굳는다. worker 프로필 전용.
      enabled: ${JOURNEY_NOTIFICATION_RELAY_ENABLED:false}
      sweep-interval-ms: 1000
      batch-size: 200
      workers: 4
      max-batches: 1000
      drain-max-millis: 5000
