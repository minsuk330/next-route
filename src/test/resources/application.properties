# 테스트 전용 오버라이드. main 의 application.yaml 을 대체하지 않고 키 단위로만 덮어쓴다.
#
# auth.jwt.secret 은 운영에서 기본값이 없다(env/auth.env 로 주입). 그래서 값이 없으면
# JwtProperties 가 부팅을 막는다. 테스트는 gitignore 대상인 env/auth.env 에 의존하면
# 안 되므로 여기서 고정 더미 값을 준다. 실제 시크릿이 아니다.
auth.jwt.secret=test-only-jwt-secret-not-a-real-one-0123456789

# oauth.* 도 운영에서 기본값이 없다(env/oauth.env 로 주입). 허용 목록이 비면 기동을 막으므로
# 테스트는 여기서 고정 더미 값을 준다. 실제 자격증명이 아니다.
oauth.apple.audiences=com.golbob.nextroute.test
oauth.kakao.app-id=123456

# 테스트 컨텍스트마다 커넥션 풀이 하나씩 생긴다. Spring 은 컨텍스트를 캐시해 두므로 다 쓴
# 컨텍스트도 살아 있고, 기본값(idle 10개 상주)이면 컨텍스트 열 개만 넘어가도 Postgres 의
# max_connections 를 먹어 치운다 — 그때 나는 오류가 "FATAL: sorry, too many clients already"
# 이고, 원인이 테스트 코드와 무관해 보여서 찾는 데 오래 걸린다.
#
# 그래서 상주 커넥션을 1개로 낮추고 필요할 때만 늘리게 한다. 상한은 남겨 둔다 — 부하 IT 가
# 워커 여러 개로 동시에 DB 를 친다.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=10000
